<!-- Camera-shutter intro (once per session) + custom "View" lens cursor -->
<app-shutter-loader />
<app-cursor />

<a class="skip-link" href="#main">{{ 'common.skipToContent' | translate }}</a>

<app-header />

<main id="main">
  <router-outlet />
</main>

<app-footer />

<!-- Floating WhatsApp button -->
<a
  class="whatsapp-fab"
  [href]="site.whatsappHref"
  target="_blank"
  rel="noopener"
  [attr.aria-label]="'common.whatsappChat' | translate"
>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
    <path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.5 8.5 0 1 1 21 11.5Z" />
    <path d="M8.5 9.5c.3 2.6 2.4 4.7 5 5l1.2-1.2 2 .9-.5 1.6c-4.2.3-8.2-3.7-7.9-7.9l1.6-.5.9 2-1.3 1.1Z" />
  </svg>
  <span class="fab-label">{{ 'common.whatsappChat' | translate }}</span>
</a>
